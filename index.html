<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernando Silva</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden !important;
  }
  .content {
    height: 100vh !important;
    min-height: 0 !important;
    overflow: hidden !important;
  }
  .hero {
    height: 100vh !important;
    min-height: 0 !important;
  }
  .resume-btn:hover {
    background: #4a6fa5 !important;
    color: #fff !important;
    transform: translateY(-3px);
    box-shadow: 0 6px 14px rgba(74,111,165,0.35);
  }
</style>
</head>
<body>

  <div class="content">

    <section id="home" class="hero reveal">
      <img class="hero-photo" src="assets/images/fernando.jpg" alt="Fernando Silva">
      <div class="hero-text">
        <h1>Fernando Silva</h1>
        <p data-i18n="hero_tagline" style="text-align: center;">
          Software Engineer<br>Integration Solution Architect
        </p>
        <div style="text-align: center; margin-top: 2.75rem;">
          <a href="resumepage/resume.html" target="_blank" rel="noopener" class="resume-btn"
             style="display: inline-block; padding: 1rem 2.75rem; border: 2px solid #4a6fa5; border-radius: 999px; background: #fff; color: #000; text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;">
            Resume
          </a>
        </div>
      </div>
    </section>

  </div>

<script>
  var translations = {
    en: {
      role: "Integration Solution Architect",
      rights: "All rights reserved.",
      nav_home: "Home",
      hero_tagline: "Software Engineer<br>Integration Solution Architect",
    },
    es: {
      role: "Arquitecto de soluciones de integración",
      rights: "Todos los derechos reservados.",
      nav_home: "Inicio",
      hero_tagline: "Ingeniero de Software<br>Arquitecto de soluciones de integración",
    }
  };

  function setLanguage(lang){
    var dict = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(dict[key]){ el.innerHTML = dict[key]; }
    });
    var btnEn = document.getElementById('btn-en');
    var btnEs = document.getElementById('btn-es');
    if (btnEn) btnEn.classList.toggle('active', lang === 'en');
    if (btnEs) btnEs.classList.toggle('active', lang === 'es');
    document.documentElement.lang = lang;
  }

  var btnEnEl = document.getElementById('btn-en');
  var btnEsEl = document.getElementById('btn-es');
  if (btnEnEl) btnEnEl.addEventListener('click', function(){ setLanguage('en'); });
  if (btnEsEl) btnEsEl.addEventListener('click', function(){ setLanguage('es'); });

  if ('IntersectionObserver' in window) {
    var revealObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        } else {
          entry.target.classList.remove('is-visible');
        }
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.reveal').forEach(function(el){
      revealObserver.observe(el);
    });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){
      el.classList.add('is-visible');
    });
  }
</script>

</body>
</html>
